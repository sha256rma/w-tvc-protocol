[package]
name = "tvc-cli"
description = "Publisher and auditor command line for the W-TVC model registry."
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tvc"
path = "src/main.rs"

[dependencies]
tvc-core = { path = "../tvc-core", version = "0.2.0" }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
